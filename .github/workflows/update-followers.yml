name: 📊 Update Social Follower Counts

on:
  schedule:
    # Runs every 30 minutes (48 times/day) — max frequency within Twitter/X free tier limit (1,500 req/month)
    - cron: '*/30 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  fetch-followers:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit followers.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run follower fetch script
        env:
          # ─── YouTube ───────────────────────────────────────────
          # Get from: https://console.cloud.google.com → Enable YouTube Data API v3 → Create API Key
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          # ─── Twitch ────────────────────────────────────────────
          # Get from: https://dev.twitch.tv/console → Register Your Application
          TWITCH_CLIENT_ID:     ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

          # ─── Instagram (Meta Graph API) ─────────────────────────
          # Get from: https://developers.facebook.com → Create App → Instagram Graph API
          # Needs a long-lived Page token and Instagram Business Account
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

          # ─── Twitter / X ───────────────────────────────────────
          # Get from: https://developer.twitter.com → Project & App → Bearer Token (Basic tier is free)
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}

          # ─── TikTok ────────────────────────────────────────────
          # Get from: https://developers.tiktok.com → Research API (requires approval)
          TIKTOK_CLIENT_KEY:    ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}

          # ─── SoundCloud ────────────────────────────────────────
          # Get from: https://soundcloud.com/you/apps → Register a new app
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}

          # ─── Spotify ───────────────────────────────────────────
          # Get from: https://developer.spotify.com/dashboard → Create App
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          # ─── LinkedIn ──────────────────────────────────────────
          # Get from: https://www.linkedin.com/developers/apps → Create App
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

        run: python fetch_followers.py

      - name: Commit and push updated followers.json
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add followers.json
          # Only commit if there are actual changes
          git diff --staged --quiet || git commit -m "📊 chore: update social follower counts [skip ci]"
          git push
